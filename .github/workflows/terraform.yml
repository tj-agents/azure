name: terraform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Run the scaffold's Terraform gate
        shell: bash
        env:
          AZURE_SCAFFOLD_TERRAFORM: "1"
        run: python -B -m unittest discover -s .agents/tests -p "test_scaffold.py"

  actions-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          curl -sSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          install -m 0755 actionlint "$RUNNER_TEMP/actionlint"
          rm actionlint actionlint.tar.gz
      - name: Install zizmor
        env:
          ZIZMOR_VERSION: "1.30.1"
          ZIZMOR_SHA256: "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a"
        run: |
          set -euo pipefail
          # zizmor's GitHub release has no published checksums file; this hash was recorded from the
          # release asset when pinning this version.
          curl -sSLo zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz zizmor
          install -m 0755 zizmor "$RUNNER_TEMP/zizmor"
          rm zizmor zizmor.tar.gz
      - name: Generate every preset's workflows
        run: python -B .agents/tests/generate_for_lint.py "$RUNNER_TEMP/presets"
      - name: actionlint
        run: |
          set -euo pipefail
          for preset in "$RUNNER_TEMP"/presets/*/; do
            echo "::group::actionlint $preset"
            (cd "$preset" && "$RUNNER_TEMP/actionlint" .github/workflows/*.yml)
            echo "::endgroup::"
          done
      - name: zizmor
        run: |
          set -euo pipefail
          for preset in "$RUNNER_TEMP"/presets/*/; do
            echo "::group::zizmor $preset"
            (cd "$preset" && "$RUNNER_TEMP/zizmor" --config "$GITHUB_WORKSPACE/.agents/tests/fixtures/zizmor-generated.yml" .github)
            echo "::endgroup::"
          done
