name: Terraform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Scaffold
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Run the Scaffold's Terraform Gate
        shell: bash
        env:
          AZURE_SCAFFOLD_TERRAFORM: "1"
        run: python -B -m unittest discover -s .agents/tests -p "test_scaffold.py"

  actions-lint:
    name: Actions Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          curl -sSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          install -m 0755 actionlint "$RUNNER_TEMP/actionlint"
          rm actionlint actionlint.tar.gz
      - name: Install zizmor
        env:
          ZIZMOR_VERSION: "1.30.1"
          ZIZMOR_SHA256: "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a"
        run: |
          set -euo pipefail
          # zizmor's GitHub release has no published checksums file; this hash was recorded from the
          # release asset when pinning this version.
          curl -sSLo zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz zizmor
          install -m 0755 zizmor "$RUNNER_TEMP/zizmor"
          rm zizmor zizmor.tar.gz
      - name: Lint This Repository's Terraform Workflow
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/actionlint" .github/workflows/terraform.yml
          "$RUNNER_TEMP/zizmor" .github/workflows/terraform.yml
      - name: Generate Every Preset's Workflows
        run: python -B .agents/tests/generate_for_lint.py "$RUNNER_TEMP/presets"
      - name: Run actionlint
        run: |
          set -euo pipefail
          for preset in "$RUNNER_TEMP"/presets/*/; do
            echo "::group::actionlint $preset"
            (cd "$preset" && "$RUNNER_TEMP/actionlint" .github/workflows/*.yml)
            echo "::endgroup::"
          done
      - name: Run zizmor
        run: |
          set -euo pipefail
          for preset in "$RUNNER_TEMP"/presets/*/; do
            echo "::group::zizmor $preset"
            (cd "$preset" && "$RUNNER_TEMP/zizmor" --config "$GITHUB_WORKSPACE/.agents/tests/fixtures/zizmor-generated.yml" .github)
            echo "::endgroup::"
          done
